name: Build Household Finance Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools not found" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Give APK a friendly name
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Household-Finance-Android.apk
          ls -lh dist/Household-Finance-Android.apk
      - name: Make APK available in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Household-Finance-Android-APK
          path: dist/Household-Finance-Android.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view android-preview >/dev/null 2>&1; then
            gh release upload android-preview dist/Household-Finance-Android.apk --clobber
          else
            gh release create android-preview dist/Household-Finance-Android.apk \
              --title "Household Finance Android - Preview APK" \
              --notes "Unsigned-for-store debug-preview app, signed automatically by the GitHub runner. Installable on Android for testing. The app loads the live HTTPS Finance Dashboard. New preview builds may require uninstalling an older build first." \
              --target "$GITHUB_SHA"
          fi
        continue-on-error: true
