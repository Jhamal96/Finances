name: Build Household Finance desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

concurrency:
  group: household-finance-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: dist:win
            artifact: finance-desktop-windows
          - os: macos-latest
            target: dist:mac
            artifact: finance-desktop-macos
    steps:
      - name: Checkout site and desktop sources
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Create test installer
        working-directory: desktop
        run: npm run ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Windows and Mac installers
    needs: installers
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: finance-desktop-*
          merge-multiple: true
          path: dist
      - name: Publish reusable test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -lh dist/
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest dist/*.exe dist/*.dmg --clobber
          else
            gh release create desktop-latest dist/*.exe dist/*.dmg \
              --target "$GITHUB_SHA" \
              --title "Household Finance — Windows & macOS" \
              --notes "Private shared-household budget website inside desktop application windows. Unsigned test installers for Windows x64 and macOS universal (Intel/Apple Silicon). You must still sign in to Household Finance. Internet connection required; separate browser and desktop local storage. Private GitHub repository requires authorization for release downloads." \
              --prerelease
          fi
