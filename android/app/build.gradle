plugins {
    id 'com.android.application'
}

android {
    namespace 'org.ajdapp.householdfinance'
    compileSdk 35

    defaultConfig {
        applicationId 'org.ajdapp.householdfinance'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
